<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
<div class="scrim" id="scrim" hidden></div>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><span></span></div>

    <nav class="switcher" role="tablist" aria-label="Modes">
      <button class="mode-btn" role="tab" data-mode="weather" aria-selected="false" title="Weather">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>
        <span class="label">Weather</span>
      </button>
      <button class="mode-btn" role="tab" data-mode="subway" aria-selected="false" title="Subway">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="4"/><path d="M5 10.5h14M9 21l1.2-4M15 21l-1.2-4"/><circle cx="9" cy="13.7" r=".4" fill="currentColor"/><circle cx="15" cy="13.7" r=".4" fill="currentColor"/></svg>
        <span class="label">Subway</span>
      </button>
      <button class="mode-btn" role="tab" data-mode="raindrop" aria-selected="false" title="Raindrop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 18.5z"/></svg>
        <span class="label">Raindrop</span>
      </button>
      <button class="mode-btn" role="tab" data-mode="music" aria-selected="false" title="Music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M7 8l9-4.5"/><circle cx="8.5" cy="14" r="2.5"/><path d="M14 12.5h3.5M14 15.5h3.5"/></svg>
        <span class="label">Music</span>
      </button>
    </nav>

    <div class="header-end">
      <button class="round-btn" id="theme-btn" aria-label="Theme">
        <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg>
      </button>
      <button class="round-btn" id="settings-btn" aria-label="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
      </button>
      <div class="popover" id="settings" hidden>
        <div class="setting">
          <h2>Tabs</h2>
          <ul class="tab-list" id="tab-list"></ul>
          <div id="tab-settings-holder" hidden>
        <form class="tab-setting" id="raindrop-form">
          <label class="ts-label" for="raindrop-token">Token</label>
          <div class="row">
            <input class="field" id="raindrop-token" type="password" autocomplete="off" spellcheck="false" aria-label="Raindrop token">
            <button class="pill-btn" type="submit">Save</button>
          </div>
          <p class="msg" id="raindrop-msg" hidden></p>
        </form>
          </div>
        </div>
        <div class="setting">
          <h2>Shortcuts</h2>
          <div class="keys">
            <kbd>1–9</kbd><span>Switch tab</span>
            <kbd>T</kbd><span>Light / dark / system</span>
            <kbd>/</kbd><span>Search Raindrop</span>
            <kbd>E</kbd><span>Edit the selected preset</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="mode" data-mode="weather" role="tabpanel" aria-label="Weather" hidden>
      <div class="cities" id="cities"></div>
      <div class="city-add">
        <button class="round-btn sm" id="city-add-btn" aria-label="Add a city" title="Add a city">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="city-search" id="city-search" hidden>
          <input class="field" id="city-q" type="text" placeholder="City" autocomplete="off" spellcheck="false" aria-label="City" aria-controls="city-results">
          <ul class="city-results" id="city-results"></ul>
        </div>
      </div>
    </section>

    <section class="mode" data-mode="subway" role="tabpanel" aria-label="Subway" hidden>
      <div class="trip-bar">
        <div class="seg" role="group" aria-label="Trip" id="trip-seg"></div>
        <div class="trip-tools">
          <button class="round-btn sm" id="trip-add" aria-label="Add a trip" title="Add a trip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="round-btn sm" id="trip-edit" aria-label="Edit this trip" title="Edit this trip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
        </div>
      </div>
      <form class="card trip-form" id="trip-form" novalidate hidden>
        <div class="trip-form-head">
          <h2 id="trip-form-title">New trip</h2>
          <button class="round-btn sm" type="button" id="trip-cancel" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <input class="field" id="trip-name" placeholder="Name" autocomplete="off" aria-label="Trip name">
        <div class="trip-route">
          <div class="station-pick">
            <input class="field" id="trip-from" placeholder="From" autocomplete="off" spellcheck="false" aria-label="From station" aria-controls="trip-from-results">
            <ul class="city-results" id="trip-from-results"></ul>
          </div>
          <button class="round-btn sm swap-btn" type="button" id="trip-swap" aria-label="Swap stations" title="Swap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
          </button>
          <div class="station-pick">
            <input class="field" id="trip-to" placeholder="To (optional)" autocomplete="off" spellcheck="false" aria-label="To station" aria-controls="trip-to-results">
            <ul class="city-results" id="trip-to-results"></ul>
          </div>
        </div>
        <div class="dir-pick" id="trip-dir-row" hidden>
          <span>Toward</span>
          <div class="seg" role="radiogroup" aria-label="Direction" id="trip-dir"></div>
        </div>
        <div class="trip-foot">
          <div class="walk-step">
            <span>Walk</span>
            <div class="stepper">
              <button type="button" id="trip-walk-minus" aria-label="One minute less">−</button>
              <output id="trip-walk" aria-live="polite">10 min</output>
              <button type="button" id="trip-walk-plus" aria-label="One minute more">+</button>
            </div>
          </div>
          <button class="pill-btn danger" type="button" id="trip-delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7M10.2 10.5v5.5M13.8 10.5v5.5"/></svg>
            <span>Delete</span>
          </button>
          <button class="pill-btn primary" type="submit">Save</button>
        </div>
        <span class="err" id="trip-err" hidden></span>
      </form>
      <div class="subway-grid">
        <div class="card hero">
          <div class="stop-row">
            <span class="bullet" aria-hidden="true">C</span>
            <div><h1 id="stop-name"></h1><p id="stop-dir"></p></div>
            <button class="status" id="status" aria-expanded="false" aria-controls="alerts" hidden><i></i><span></span></button>
          </div>
          <ul class="alerts" id="alerts" hidden></ul>
          <div>
            <div class="leave-big" id="leave-big">–</div>
            <p class="leave-sub" id="leave-sub"></p>
          </div>
        </div>
        <div class="card">
          <div class="dir-head"><h2>Next trains</h2><p id="updated"></p></div>
          <ul class="deps" id="deps"></ul>
        </div>
      </div>
    </section>

    <section class="mode" data-mode="raindrop" role="tabpanel" aria-label="Raindrop" hidden>
      <div class="finder">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="insp-q" type="text" placeholder="Search or paste a link" autocomplete="off" spellcheck="false" aria-label="Search or add a link" aria-controls="hits">
          <button class="icon-btn" id="insp-clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
          <button class="icon-btn" id="insp-shuffle" aria-label="Surprise me" title="Surprise me">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3 1 4.5 3.5S14 17 16.5 17H21M3 17h3.5c1.3 0 2.1-.4 3-1.4M14.5 8.4c.6-.9 1.2-1.4 2-1.4H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
          </button>
        </div>
        <div class="filters" id="insp-filters" role="group" aria-label="Category"></div>
        <ol class="hits" id="hits"></ol>
      </div>
    </section>

    <section class="mode" data-mode="music" role="tabpanel" aria-label="Music" hidden>
      <div class="card radio" id="radio">
        <div class="lcd" id="lcd" aria-live="polite"></div>
        <div class="presets" id="presets" role="group" aria-label="Presets"></div>
        <div class="radio-foot">
          <button class="pill-btn hover-label" id="edit-presets" aria-pressed="false" aria-label="Edit presets">
            <svg class="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
            <svg class="i-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <span>Edit presets</span>
          </button>
          <button class="pill-btn" id="add-row" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add a row</span>
          </button>
          <a class="pill-btn primary listen" id="listen" href="#">
            <span>Listen</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
          </a>
        </div>
      </div>
    </section>

    <section class="mode" data-mode="board" role="tabpanel" aria-label="Links" id="board-section" hidden>
      <div id="work"></div>
    </section>
  </main>
</div>
<script src="gtfs.js"></script>
<script src="stations.js"></script>
<script src="brand-icons.js"></script>
<script src="defaults.local.js"></script>
<script src="app.js"></script>
</body>
</html>
